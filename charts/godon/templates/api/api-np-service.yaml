---
## NodePort entrypoint to API - the workflow CLIs ride the node port
## directly (kind maps host 127.0.0.1:32002 -> this nodePort; the
## kubectl port-forward tunnel flapped through two flights on 10-08)
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-api-np"  (include "godon.fullname" .) | trunc 58 | quote }}
  labels:
    service-type: "api-endpoint-np"
spec:
  type: "NodePort"
  ports:
    - protocol: TCP
      name: "api-np-port"
      port: 8080
      targetPort: 8080
      nodePort: 32002
  selector:
    component: api
    release: {{ .Release.Name }}
