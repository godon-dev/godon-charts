---

########################################
## CONFIG | Global Variables
########################################
#  global:
#    PROMETHEUS_URL: http//prometheus9090

########################################
## Network | Kubernetes Cluster Domain
########################################
clusterDomain: cluster.local

########################################
## Network | Godon DNS Domain
########################################
domainName: "cluster.local"

########################################
## Component | Godon Seeder Job
########################################
godon_seeder:
  enabled: true
  image:
    repository: ghcr.io/godon-dev/godon-seeder
    tag: 0.0.23
    pullPolicy: IfNotPresent
    pullSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccountName: ""
  env:
  - name: WINDMILL_BASE_URL
    value: "http://windmill-app.godon.svc.cluster.local:8000/api"
  - name: CONTROLLER_VERSION
    value: "0.59.3"
  - name: ROBOT_VERSION
    value: "0.170.3"
  # Fresh-Windmill boot tolerance: first boot runs DB migrations
  # before the auth endpoint answers; give the seeder ~10 minutes.
  - name: SEEDER_MAX_RETRIES
    value: "60"
  - name: SEEDER_RETRY_DELAY
    value: "10"

########################################
## Component | Windmill Workflow Orchestration Engine
########################################
windmill:
  postgresql:
    enabled: false
  windmill:
    image: "ghcr.io/windmill-labs/windmill-full"
    tag: "1.623.1"
    appReplicas: 1
    lspReplicas: 1
    databaseUrl: "postgres://windmill:windmill@godon-windmill-db:5432/windmill?sslmode=disable"
    workerGroups:
      # Controller workers - handle fast operations (preflight, robot_create, etc)
      # Timeout hierarchy: Script-level > Worker group DEFAULT_TIMEOUT_SECONDS > Global default
      - name: "controller"
        replicas: 3
        extraEnv:
        - name: WORKER_GROUP
          value: "controller"
        - name: WORKER_TAGS
          value: "controller"
        - name: DEFAULT_TIMEOUT_SECONDS
          value: "120"  # 2 minutes - fast controller operations
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://godon-observability-opentelemetry-collector.godon-observability.svc.cluster.local:4318"
        - name: OTEL_SERVICE_NAME
          value: "godon-controller"
        - name: GODON_CAUSAL_URL
          value: "http://godon-causal:9091"
        - name: GODON_ARCHIVE_DB_SERVICE_HOST
          value: "yb-tservers.godon.svc.cluster.local"
        - name: GODON_ARCHIVE_DB_SERVICE_PORT
          value: "5433"
        - name: GODON_ARCHIVE_DB_USER
          value: "yugabyte"
        - name: GODON_ARCHIVE_DB_PASSWORD
          value: "yugabyte"
        - name: WHITELIST_ENVS
          value: "OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_SERVICE_NAME,GODON_API_SERVICE_PORT,GODON_METADATA_DB_SERVICE_PORT,YB_TSERVER_SERVICE_SERVICE_PORT,GODON_API_SERVICE_HOST,GODON_METADATA_DB_SERVICE_HOST,YB_TSERVER_SERVICE_SERVICE_HOST,YB_TSERVER_SERVICE_SERVICE_PORT_TCP_YSQL_PORT,GODON_ARCHIVE_DB_SERVICE_HOST,GODON_ARCHIVE_DB_SERVICE_PORT,GODON_ARCHIVE_DB_USER,GODON_ARCHIVE_DB_PASSWORD,GODON_CAUSAL_URL"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

      # Robot workers - handle long-running robot optimization jobs
      # No timeout - continuous workers with crash recovery via Optuna DB
      - name: "robot"
        replicas: 10
        extraEnv:
        - name: WORKER_GROUP
          value: "robot"
        - name: WORKER_TAGS
          value: "robot,systemtender"
        - name: GODON_DETECTION_DEBUG
          value: "1"
        - name: GODON_CAUSAL_URL
          value: "http://godon-causal:9091"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://godon-observability-opentelemetry-collector.godon-observability.svc.cluster.local:4318"
        - name: OTEL_SERVICE_NAME
          value: "godon-robots"
        - name: GODON_ARCHIVE_DB_SERVICE_HOST
          value: "yb-tservers.godon.svc.cluster.local"
        - name: GODON_ARCHIVE_DB_SERVICE_PORT
          value: "5433"
        - name: GODON_ARCHIVE_DB_USER
          value: "yugabyte"
        - name: GODON_ARCHIVE_DB_PASSWORD
          value: "yugabyte"
        - name: PUSH_GATEWAY_URL
          value: "http://godon-prometheus-pushgateway:9091"
        - name: PUSH_METRICS_ENABLED
          value: "true"
        - name: WHITELIST_ENVS
          value: "OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_SERVICE_NAME,GODON_API_SERVICE_PORT,GODON_METADATA_DB_SERVICE_PORT,YB_TSERVER_SERVICE_SERVICE_PORT,GODON_API_SERVICE_HOST,GODON_METADATA_DB_SERVICE_HOST,YB_TSERVER_SERVICE_SERVICE_HOST,YB_TSERVER_SERVICE_SERVICE_PORT_TCP_YSQL_PORT,GODON_ARCHIVE_DB_SERVICE_HOST,GODON_ARCHIVE_DB_SERVICE_PORT,GODON_ARCHIVE_DB_USER,GODON_ARCHIVE_DB_PASSWORD,PUSH_GATEWAY_URL,PUSH_METRICS_ENABLED,GODON_DETECTION_DEBUG,GODON_CAUSAL_URL"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

      # Default workers - handle any job without a specific tag
      # Picks up dependency resolution, untagged scripts, and general operations
      - name: "default"
        replicas: 3
        extraEnv:
        - name: WORKER_GROUP
          value: "default"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

########################################
## Component | Godon Observer
########################################
observer:
  image:
    repository: "ghcr.io/godon-dev/godon-observer"
    tag: "0.71.0"
    pullPolicy: IfNotPresent
    pullSecret: ""

  replicas: 1

  port: 9099
  containerPort: 8089

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
  - name: HOST
    value: "0.0.0.0"
  - name: PUSH_GATEWAY_URL
    value: "http://godon-prometheus-pushgateway:9091"
  - name: PUSH_METRICS_ENABLED
    value: "true"
  - name: GODON_ARCHIVE_DB_USER
    value: "yugabyte"
  - name: GODON_ARCHIVE_DB_PASSWORD
    value: "yugabyte"
  - name: GODON_ARCHIVE_DB_SERVICE_HOST
    value: "yb-tservers.godon.svc.cluster.local"
  - name: GODON_ARCHIVE_DB_SERVICE_PORT
    value: "5433"
  - name: GODON_API_URL
    value: "http://godon-api:9090"
  - name: GODON_CAUSAL_URL
    value: "http://godon-causal:9091"

  livenessProbe:
    enabled: false

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  annotations: {}

  podLabels: {}

  serviceAccountName: ""

  volumes: []

  volumeMounts: []

########################################
## Component | godon-causal
########################################
causal:
  image:
    repository: "ghcr.io/godon-dev/godon-causal"
    tag: "0.22.10"
    pullPolicy: IfNotPresent
    pullSecret: ""

  replicas: 1

  port: 9091
  containerPort: 8091

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "8091"
  - name: GODON_ARCHIVE_DB_USER
    value: "yugabyte"
  - name: GODON_ARCHIVE_DB_PASSWORD
    value: "yugabyte"
  - name: GODON_ARCHIVE_DB_SERVICE_HOST
    value: "yb-tservers.godon.svc.cluster.local"
  - name: GODON_ARCHIVE_DB_SERVICE_PORT
    value: "5433"
  - name: GODON_DETECTION_CONFIDENCE
    value: "0.95"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://godon-observability-opentelemetry-collector.godon-observability.svc.cluster.local:4318"
  - name: OTEL_SERVICE_NAME
    value: "godon-causal"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  annotations: {}

  podLabels: {}

  serviceAccountName: ""

  volumes: []

  volumeMounts: []

  service:
    annotations: {}

########################################
## Component | Prometheus Push Gateway
########################################
pushgateway:
  enabled: true

  image:
    repository: prom/pushgateway
    tag: v1.9.0
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 9091

  persistence:
    enabled: false
    size: 2Gi
    storageClass: ""

  # Optional service account
  serviceAccount:
    create: false

  # Pod disruption budget
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

########################################
## Component | Godon API
########################################
api:
  image:
    repository: "ghcr.io/godon-dev/godon-api"
    tag: "0.0.27"
    pullPolicy: IfNotPresent
    pullSecret: ""

  replicas: 1

  port: 9090

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
  - name: WINDMILL_BASE_URL
    value: "http://windmill-app.godon.svc.cluster.local:8000/api"
  - name: GODON_CAUSAL_URL
    value: "http://godon-causal:9091"

  livenessProbe:
    enabled: false

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  annotations: {}

  podLabels: {}

  serviceAccountName: ""

  volumes: []

  volumeMounts: []

########################################
## Component | Godon MCP Server
########################################
mcp:
  image:
    repository: "ghcr.io/godon-dev/godon-mcp"
    tag: "0.0.9"
    pullPolicy: IfNotPresent
    pullSecret: ""

  replicas: 1

  port: 3001
  containerPort: 3001

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
  - name: GODON_API_HOSTNAME
    value: "godon-api.godon.svc.cluster.local"
  - name: GODON_API_PORT
    value: "9090"
  - name: GODON_CAUSAL_HOSTNAME
    value: "godon-godon-causal"
  - name: GODON_CAUSAL_PORT
    value: "9091"
  - name: PORT
    value: "3001"

  livenessProbe:
    enabled: false

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  annotations: {}

  podLabels: {}

  serviceAccountName: ""

  volumes: []

  volumeMounts: []

########################################
## Component | Postgres Database Storing Godon Components Meta Data
########################################
metadata-db:
  image:
    repository: "postgres"
    tag: 16
    pullPolicy: IfNotPresent
  postgresqlDataDir: "/var/lib/postgresql/data"
  auth:
    username: meta_data
    password: meta_data
    database: meta_data

  primary:
    containerSecurityContext:
      runAsUser: 999
    podSecurityContext:
      fsGroup: 999
    args:
      - "-c"
      - "max_connections=500"
      - "-c"
      - "shared_buffers=128MB"

########################################
## Component | Postgres Database for Windmill
########################################
windmill-db:
  image:
    repository: "postgres"
    tag: 16
    pullPolicy: IfNotPresent
  postgresqlDataDir: "/var/lib/postgresql/data"
  auth:
    username: windmill
    password: windmill
    database: windmill

  primary:
    containerSecurityContext:
      runAsUser: 999
    podSecurityContext:
      fsGroup: 999
    args:
      - "-c"
      - "max_connections=500"
      - "-c"
      - "shared_buffers=128MB"

########################################
## Component | Knowledge Archive Database for Cooperating Config Robots
########################################
archive-db:

  enabled: false

  # Disable Load Balancer As Only used Internally
  enableLoadBalancer: false

  image:
    repository: "docker.io/yugabytedb/yugabyte"
    tag: 2025.2.3.2
    pullPolicy: IfNotPresent

  replicas:
    master: 1
    tserver: 1

  storage:
    ephemeral: false
    master:
      count: 1
      size: 1Gi
      storageClass: ""
    tserver:
      count: 1
      size: 20Gi
      storageClass: ""

  resource:
    master:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    tserver:
      requests:
        cpu: "0.2"
        memory: 200Mi
      limits:
        cpu: "2"
        memory: 2Gi

  master:
    extraEnv:
      - name: YSQL_DB
        value: archive_db
      - name: PUSH_GATEWAY_URL
        value: "http://godon-prometheus-pushgateway:9091"
      - name: PUSH_METRICS_ENABLED
        value: "true"

  authCredentials:
    ysql:
      user: yugabyte
      password: yugabyte
      database: archive_db

  dnsPolicy: ClusterFirst

########################################
## Component | Grafana Alloy (Log Collection)
########################################
alloy:
  enabled: false

  loki:
    endpoint: "http://loki.godon-observability.svc.cluster.local:3100/loki/api/v1/push"

  extraEnv:
    - name: GOMAXPROCS
      value: "2"
    - name: GOMEMLIMIT
      value: "512MiB"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

  alloy:
    configMap:
      content: |
        loki.write "default" {
          endpoint {
             url = "http://loki.godon-observability.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

        loki.source.api "receiver" {
          http {
            listen_address = "0.0.0.0"
            listen_port = 3500
          }

          forward_to = [loki.write.default.receiver]
        }
